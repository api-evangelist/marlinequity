name: Marlin Equity Partners
description: 'Marlin Equity Partners (marlinequity.com) is a global investment firm
  founded in 2005 and headquartered in Hermosa Beach, California, with an additional
  office in London. The firm acquires and builds software and technology businesses,
  partnering with management teams to create strategic value through operational support,
  organic growth, and add-on acquisitions, with particular focus on financial technology
  and e-commerce segments. Its portfolio has included companies such as Bazaarvoice,
  Medius, StarCompliance, Exegy, and Learning Pool. This profile was surfaced as a
  portfolio-network lead and enriched by the API Evangelist pipeline; as a private
  equity investor rather than a technology service provider, Marlin publishes no public
  API, developer portal, or technical documentation.'
